<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Limpando cache do Prospecta…</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #070a0e;
        color: #d5dee6;
      }
      p { color: #8fa8b5; }
      a { color: #3ad4ba; }
    </style>
  </head>
  <body>
    <main style="text-align: center; padding: 2rem">
      <h1>Removendo cache do Prospecta</h1>
      <p id="status">Limpando service workers…</p>
      <p><a href="http://localhost:3100/">Abrir portfólio agora</a></p>
    </main>
    <script>
      (async () => {
        const status = document.getElementById("status");
        try {
          if ("serviceWorker" in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map((r) => r.unregister()));
          }
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((k) => caches.delete(k)));
          }
          status.textContent = "Cache limpo. Abrindo o portfólio…";
        } catch (e) {
          status.textContent = "Não foi possível limpar tudo. Abrindo mesmo assim…";
        }
        setTimeout(() => {
          location.replace("http://localhost:3100/");
        }, 600);
      })();
    </script>
  </body>
</html>
